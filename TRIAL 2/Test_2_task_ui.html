<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Launchmen — Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; padding: 40px 20px; }
    h1 { font-size: 24px; margin-bottom: 24px; color: #1a1a2e; }

    .add-form { display: flex; gap: 10px; margin-bottom: 32px; }
    .add-form input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .add-form button { padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }

    #status-msg { font-size: 13px; color: #888; margin-bottom: 16px; min-height: 18px; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    th { background: #1a1a2e; color: white; padding: 12px 16px; text-align: left; font-size: 13px; }
    td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: bold; }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-done     { background: #d4edda; color: #1a7a3c; }

    .btn-done   { padding: 6px 14px; background: #1a7a3c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 6px; }
    .btn-delete { padding: 6px 14px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-done:disabled { opacity: 0.4; cursor: default; }

    #empty-msg { text-align: center; padding: 40px; color: #999; font-size: 14px; display: none; }
  </style>
</head>
<body>

  <h1>🚀 Launchmen Task Manager</h1>

  <div class="add-form">
    <input type="text" id="task-input" placeholder="Enter task title..." />
    <button onclick="addTask()">Add Task</button>
  </div>

  <div id="status-msg"></div>

  <table id="task-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="task-body">
    </tbody>
  </table>
  <div id="empty-msg">No tasks yet. Add one above!</div>

  <script>
    const API = 'http://localhost:3000';

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    async function loadTasks() {
      try {
        const res = await fetch(`${API}/tasks`);
        const data = await res.json();
        renderTasks(data.tasks);
      } catch (e) {
        setStatus('⚠️ Could not connect to API. Is the server running?');
      }
    }

    function renderTasks(tasks) {
      const tbody = document.getElementById('task-body');
      const empty = document.getElementById('empty-msg');
      tbody.innerHTML = '';

      if (!tasks || tasks.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tasks.forEach(task => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${task.id}</td>
          <td>${task.title}</td>
          <td><span class="badge badge-${task.status === 'done' ? 'done' : 'pending'}">${task.status}</span></td>
          <td>
            <button class="btn-done" onclick="markDone(${task.id})" ${task.status === 'done' ? 'disabled' : ''}>
              Mark Done
            </button>
            <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addTask() {
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      if (!title) {
        setStatus('⚠️ Please enter a task title.');
        return;
      }
      try {
        const res = await fetch(`${API}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        const data = await res.json();
        if (res.ok) {
          input.value = '';
          setStatus(`✅ Task "${data.task.title}" added.`);
          loadTasks();
        } else {
          setStatus(`❌ Error: ${data.message}`);
        }
      } catch (e) {
        setStatus('⚠️ Could not connect to API.');
      }
    }

    async function markDone(id) {
      try {
        const res = await fetch(`${API}/tasks/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'done' })
        });
        const data = await res.json();
        if (res.ok) {
          setStatus(`✅ Task marked as done.`);
          loadTasks();
        } else {
          setStatus(`❌ Error: ${data.message}`);
        }
      } catch (e) {
        setStatus('⚠️ Could not connect to API.');
      }
    }

    async function deleteTask(id) {
      try {
        const res = await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok) {
          setStatus(`🗑️ Task deleted.`);
          loadTasks();
        } else {
          setStatus(`❌ Error: ${data.message}`);
        }
      } catch (e) {
        setStatus('⚠️ Could not connect to API.');
      }
    }

    // Initialize
    loadTasks();
  </script>

</body>
</html>
